name: CI-CD DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  quality-security-build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Python syntax check
        run: python -m py_compile app/src/app.py

      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Docker image
        run: docker build -t sadok21/pfe-devsecops-app:latest ./app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sadok21/pfe-devsecops-app:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push sadok21/pfe-devsecops-app:latest

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8S/namespace.yaml
          kubectl apply -f k8S/deployment.yaml
          kubectl apply -f k8S/service.yaml
          kubectl rollout restart deployment/pfe-app -n pfe-devsecops
          kubectl rollout status deployment/pfe-app -n pfe-devsecops
